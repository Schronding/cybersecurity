services:
  php-pre-fix:
    image: php:8.3.35-apache
    container_name: php2shell-pre-fix
    restart: "no"
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html:ro

  php-fixed:
    image: php:8.3.36-apache
    container_name: php2shell-fixed
    restart: "no"
    ports:
      - "8081:80"
    volumes:
      - ./web:/var/www/html:ro
