[project]
name = "stegano"
version = "0.1.0"
description = "Stack Educativo de Esteganografía LSB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
]

[project.scripts]
stegano = "stegano.master:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
